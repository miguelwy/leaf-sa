# Local stack: MongoDB Atlas Local (supports Atlas Search / Vector Search for later phases)
# plus the app. For day-to-day development run only `mongo` and use `npm run dev`.
name: sa-workspace

services:
  mongo:
    image: mongodb/mongodb-atlas-local:8.0
    environment:
      MONGODB_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-sa}
      MONGODB_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-sa-local-password}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "-u", "${MONGO_ROOT_USERNAME:-sa}", "-p", "${MONGO_ROOT_PASSWORD:-sa-local-password}", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  app:
    build: .
    profiles: ["app"]
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-sa}:${MONGO_ROOT_PASSWORD:-sa-local-password}@mongo:27017/?directConnection=true&authSource=admin
      MONGODB_DB: ${MONGODB_DB:-sa_workspace}
      AUTH_SECRET: ${AUTH_SECRET:-} # required: set it in .env (see .env.example)
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  mongo-data:
  mongo-config:
